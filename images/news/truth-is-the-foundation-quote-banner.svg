<svg xmlns="http://www.w3.org/2000/svg" width="1273" height="766" viewBox="0 0 1273 766">
<defs>
  <linearGradient id="bg" x2="0" y2="1">
    <stop offset="0%" stop-color="#b91c2c"/>
    <stop offset="100%" stop-color="#e53935"/>
  </linearGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" opacity="0.12"/>
  </filter>
</defs>

<rect width="100%" height="100%" fill="url(#bg)"/>
<rect width="100%" height="100%" filter="url(#grain)" opacity="0.35"/>

<g fill="#f8e7c4" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
  <text x="50%" y="18%" font-size="90">“</text>
  <text x="50%" y="38%" font-size="110" font-weight="700">Truth</text>
  <text x="50%" y="46%" font-size="65">is the foundation</text>
  <text x="50%" y="54%" font-size="65">of every story.</text>
</g>

<g stroke="#e8c77a" stroke-width="3" opacity="0.8">
  <line x1="15%" y1="25%" x2="38%" y2="25%"/>
  <line x1="62%" y1="25%" x2="85%" y2="25%"/>
  <line x1="35%" y1="61%" x2="65%" y2="61%"/>
</g>

<g fill="none" stroke="#f1d39a" stroke-width="5" opacity="0.35">
  <path d="M10 85% C25 78%, 45 90%, 60 82%"/>
  <path d="M70% 85% l15 -40 l15 40"/>
</g>
</svg>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Temporary Site Error | CorporateWire</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .error-page { min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #fafafa; }
    .error-card { max-width: 680px; padding: 52px; border-top: 4px solid #ff003c; background: #fff; box-shadow: 0 14px 45px rgba(0,0,0,.08); }
    .error-card span { color: #d60032; font: 800 12px/1.2 WorkSans, Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    .error-card h1 { margin: 12px 0; font: 700 42px/1.12 Bitter, Georgia, serif; }
    .error-card p { margin-bottom: 24px; color: #555; font: 400 17px/1.65 WorkSans, Arial, sans-serif; }
    .error-card a { display: inline-block; padding: 13px 20px; color: #fff; background: #111; font: 700 14px/1 WorkSans, Arial, sans-serif; }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <span>Error 500</span>
      <h1>Something went wrong.</h1>
      <p>The site encountered a temporary problem. Please try again shortly or return to the homepage.</p>
      <a href="/">Return to CorporateWire</a>
    </section>
  </main>
</body>
</html>
